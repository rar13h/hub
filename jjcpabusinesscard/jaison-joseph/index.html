<title>Jaison Joseph, CPA — Digital Business Card</title>
<style>
  :root {
    --bg: #F5FAF6; --ink: #1a1c1e; --sub: #5b5f63;
    --primary: #14532D; --accent: #2F855A; --border: #CFE8D5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; justify-content: center; padding: 36px 16px; }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .org-name { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -0.01em; margin: 0 0 26px; line-height: 1.2; }
  .qr-link { display: inline-block; }
  .qr-wrap { margin: 0 0 26px; }
  .qr-wrap img { width: 200px; height: 200px; border-radius: 12px; border: 6px solid #ffffff; box-shadow: 0 0 0 1px var(--border); }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; color: var(--primary); }
  .title { color: var(--accent); font-weight: 700; font-size: 19px; margin: 0 0 26px; }
  .actions { display: grid; gap: 10px; margin-bottom: 8px; text-align: left; }
  .btn { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border: 1px solid var(--border); border-radius: 10px; background: none; color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; }
  .btn.disabled { color: var(--sub); font-style: italic; cursor: default; }
  .icon { width: 20px; text-align: center; flex-shrink: 0; }
</style>
</head>
