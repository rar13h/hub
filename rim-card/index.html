<style>
  :root {
    --bg: #f7f4ef; --panel: #ecdfc4; --ink: #161513; --sub: #6e5730;
    --accent: #1c2430; --border: #d8c9a6;
    --font-heading: "Cormorant Garamond", Georgia, serif;
    --font-body: "Barlow", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg);
    color: var(--ink); font-family: var(--font-body); display: flex; justify-content: center; padding: 40px 16px;
  }
  .card { width: 100%; max-width: 380px; text-align: center; position: relative; padding: 34px 26px 26px; }
  .corner { position: absolute; width: 22px; height: 22px; border: 2px solid var(--accent); }
  .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
  .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
  .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }
  .logo { width: 72px; height: 72px; margin: 0 auto 18px; display: block; }
  h1 { font-family: var(--font-heading); font-weight: 700; font-size: 36px; line-height: 1.08; margin: 0 0 8px; letter-spacing: -0.01em; color: var(--ink); }
  .tagline { font-family: var(--font-heading); font-style: italic; font-size: 17px; color: var(--sub); margin: 0 auto 28px; max-width: 26ch; }
  .qr-wrap { margin: 0 0 28px; }
  .qr-wrap img { width: 210px; height: 210px; border-radius: 6px; display: block; margin: 0 auto; }
  .contact-list { text-align: left; margin: 0 0 26px; }
  .contact-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 2px; border-bottom: 1px dotted var(--border); text-decoration: none; color: var(--ink); }
  .contact-row:first-child { border-top: 1px dotted var(--border); }
  .contact-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sub); flex-shrink: 0; }
  .contact-value { font-family: var(--font-heading); font-size: 17px; font-weight: 600; color: var(--ink); text-align: right; }
  .btn { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-radius: 3px; border: 1px solid var(--border); background: #ffffff; color: var(--ink); text-decoration: none; font-size: 13.5px; font-weight: 500; }
  .icon { width: 18px; text-align: center; flex-shrink: 0; color: var(--sub); }
  .save-wrap { border-top: 1px solid var(--border); padding-top: 20px; }
  .save-btn { justify-content: center; font-size: 15px; padding: 15px; background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
</style>
