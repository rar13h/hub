<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brandon — Digital Business Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --bg: #faf9f7; --ink: #161616; --sub: #6b6b66;
    --primary: #161616; --accent: #a4833f; --border: #e6e2d8; --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; justify-content: center; padding: 36px 16px; }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .logo-link { display: inline-block; }
  .logo { width: 150px; height: auto; margin: 0 auto 10px; display: block; }
  .tagline { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 26px; }
  .qr-wrap { margin: 0 0 26px; }
  .qr-wrap img { width: 190px; height: 190px; border-radius: 12px; border: 6px solid var(--card); box-shadow: 0 0 0 1px var(--border); }
  .qr-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sub); margin-top: 10px; }
  h1 { font-family: "Cardo", serif; font-size: 30px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.005em; color: var(--primary); }
  .title { font-family: "Cardo", serif; color: var(--accent); font-weight: 700; font-style: italic; font-size: 19px; margin: 0 0 26px; }
  .actions { display: grid; gap: 10px; margin-bottom: 22px; text-align: left; }
  .btn { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; }
  .icon { width: 20px; text-align: center; flex-shrink: 0; }
  .socials { display: flex; justify-content: center; gap: 14px; padding-bottom: 22px; }
  .social { width: 42px; height: 42px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; }
  .social svg { width: 20px; height: 20px; fill: var(--bg); }
  .save-wrap { border-top: 1px solid var(--border); padding-top: 22px; }
  .save-btn { justify-content: center; font-size: 16px; padding: 16px; background: var(--primary); color: var(--bg); border-color: var(--primary); font-weight: 600; }
</style>
</head>
