<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex Rivera — Digital Business Card</title>
<style>
  :root {
    --paper: #fbfaf9; --ink: #1a1c1e; --sub: #5b5f63;
    --navy: #1d2d3d; --accent: #6b5344; --hair: #e3ddd6; --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; justify-content: center; padding: 40px 16px; }
  .card { width: 100%; max-width: 380px; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; background: var(--navy); color: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 600; letter-spacing: 0.02em; margin: 0 auto 18px; }
  h1 { text-align: center; font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .title { text-align: center; color: var(--sub); font-size: 14px; margin: 0 0 1px; }
  .org { text-align: center; color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; margin: 0 0 28px; }
  .actions { display: grid; gap: 10px; margin-bottom: 28px; }
  .btn { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 10px; border: 1px solid var(--hair); background: var(--card); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; }
  .btn.primary { background: var(--navy); color: var(--paper); border-color: var(--navy); font-weight: 600; }
  .icon { width: 20px; text-align: center; flex-shrink: 0; }
  .qr-section { text-align: center; border-top: 1px solid var(--hair); padding-top: 24px; }
  .qr-section img { width: 140px; height: 140px; border-radius: 8px; }
  .qr-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sub); margin-top: 10px; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">AR</div>
    <h1>Alex Rivera</h1>
    <p class="title">Small Business Consultant</p>
    <p class="org">Ek Din Consulting</p>

    <div class="actions">

        <span class="icon">＋</span> Save to Contacts
      </a>
      <a class="btn" href="tel:+15551234567">

      </a>
      <a class="btn" href="mailto:alex@example.com">
        <span class="icon">✉</span> alex@example.com
      </a>
      <a class="btn" href="https://rar13h.github.io/technical-consultant-website-design/" target="_blank" rel="noopener">
