<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelly Barlow — Ocean Therapy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #EDF2EC; --indigo: #13264D; --cyan: #0095A4;
    --frost: #99D3D9; --copper: #DD9787; --ink: #1a1c1e; --sub: #5b5f63;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--mint); color: var(--ink); font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; justify-content: center; padding: 36px 16px; }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .logo-link { display: inline-block; }
  .logo { width: 150px; height: auto; margin: 0 auto 10px; display: block; }
  .tagline { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); margin: 0 0 26px; }
  .qr-wrap { margin: 0 0 26px; }
  .qr-wrap img { width: 190px; height: 190px; border-radius: 12px; border: 6px solid #ffffff; box-shadow: 0 0 0 1px var(--frost); }
  .qr-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sub); margin-top: 10px; }
  h1 { font-family: "Fraunces", serif; font-size: 28px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; color: var(--indigo); }
  .title { color: var(--cyan); font-weight: 600; font-size: 14px; margin: 0 0 26px; }
  .actions { display: grid; gap: 10px; margin-bottom: 22px; text-align: left; }
  .btn { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 10px; border: 1px solid var(--frost); background: #ffffff; color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; }
  .btn.primary { background: var(--indigo); color: var(--mint); border-color: var(--indigo); font-weight: 600; }
  .icon { width: 20px; text-align: center; flex-shrink: 0; }
  .socials { display: flex; justify-content: center; gap: 14px; border-top: 1px solid var(--frost); padding-top: 22px; }
  .social { width: 42px; height: 42px; border-radius: 50%; background: var(--indigo); display: flex; align-items: center; justify-content: center; }
  .social svg { width: 20px; height: 20px; fill: var(--mint); }
</style>
</head>
