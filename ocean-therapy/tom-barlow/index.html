  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--mint); color: var(--ink); font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; justify-content: center; padding: 40px 16px; }
  .card { width: 100%; max-width: 380px; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; background: var(--indigo); color: var(--mint); display: flex; align-items: center; justify-content: center; font-family: "Fraunces", serif; font-size: 30px; font-weight: 600; letter-spacing: 0.02em; margin: 0 auto 18px; }
  h1 { font-family: "Fraunces", serif; text-align: center; font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; color: var(--indigo); }
  .title { text-align: center; color: var(--cyan); font-weight: 600; font-size: 14px; margin: 0 0 1px; }
  .org { text-align: center; color: var(--sub); font-size: 13px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; margin: 0 0 28px; }
  .actions { display: grid; gap: 10px; margin-bottom: 28px; }
  .btn { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 10px; border: 1px solid var(--frost); background: #ffffff; color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; }
  .btn.primary { background: var(--indigo); color: var(--mint); border-color: var(--indigo); font-weight: 600; }
  .icon { width: 20px; text-align: center; flex-shrink: 0; }
  .qr-section { text-align: center; border-top: 1px solid var(--frost); padding-top: 24px; }
  .qr-section img { width: 140px; height: 140px; border-radius: 8px; border: 4px solid #ffffff; box-shadow: 0 0 0 1px var(--frost); }
  .qr-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sub); margin-top: 10px; }
