<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Roasted — Digital Business Card</title>
<style>
  :root {
    --bg: #fffaee; --ink: #3b1e0c; --sub: #8a6a4e;
    --accent: #c8873f; --border: #f0dfb8; --card: #ffffff; --butter: #fde7ae;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Fredoka', -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; padding: 22px 16px; }
  .card { width: 100%; max-width: 340px; text-align: center; }
  .logo { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto; display: block; box-shadow: 0 0 0 5px var(--card), 0 0 0 6px var(--border); }
  h1 { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 25px; margin: 16px 0 2px; letter-spacing: -0.01em; color: var(--ink); }
  .title { font-family: 'Gaegu', cursive; font-weight: 700; color: var(--accent); font-size: 17px; margin: 0 0 16px; }
  .qr-wrap { margin: 8px 0 0; }
  .qr-wrap img { width: 120px; height: 120px; border-radius: 10px; border: 4px solid var(--card); box-shadow: 0 0 0 1px var(--border); }
  .qr-label { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sub); margin-top: 5px; }
  .lead-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 16px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--accent); text-decoration: none; font-size: 12px; font-weight: 600; }
  .save-btn { background: transparent; color: var(--accent); }
  .ig-btn { background: var(--accent); color: #fff; }
  .icon { width: 16px; text-align: center; flex-shrink: 0; }
  .actions { display: grid; gap: 6px; margin-top: 10px; text-align: left; }
  .actions .btn { justify-content: flex-start; border-radius: 9px; border: 1px solid var(--border); font-weight: 500; }
  .hand-note { font-family: 'Gaegu', cursive; font-weight: 700; font-size: 18px; color: var(--sub); margin: 18px 0 0; }
  .socials { display: flex; justify-content: center; gap: 10px; padding: 16px 0 4px; }
  .social { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .social svg { width: 17px; height: 17px; fill: var(--bg); }

  @media (min-width: 600px) {
    .card { max-width: 420px; }
    .logo { width: 170px; height: 170px; }
    h1 { font-size: 34px; margin: 22px 0 4px; }
    .title { font-size: 22px; margin: 0 0 22px; }
    .qr-wrap { margin: 14px 0 0; }
    .qr-wrap img { width: 175px; height: 175px; }
    .qr-label { font-size: 11px; margin-top: 10px; }
    .lead-actions { gap: 12px; margin-top: 24px; }
    .btn { font-size: 16px; padding: 15px 14px; }
    .hand-note { font-size: 23px; margin-top: 26px; }
    .socials { gap: 16px; padding: 24px 0 4px; }
    .social { width: 48px; height: 48px; }
    .social svg { width: 22px; height: 22px; }
  }
</style>
