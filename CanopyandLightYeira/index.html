<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeira de León — Digital Business Card</title>
<style>
  :root {
    --bg: #f6faf3; --ink: #1a1c1e; --sub: #6b7566;
    --primary: #2b3b73; --accent: #3f6b34; --border: #dde6d4; --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; padding: 22px 16px; }
  .card { width: 100%; max-width: 340px; text-align: center; }
  .logo-link { display: inline-block; }
  .logo { width: 50px; height: auto; margin: 0 auto; display: block; }
  .tagline { font-size: 8.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 6px 0 10px; }
  .qr-wrap { margin: 6px 0 0; }
  .qr-wrap img { width: 120px; height: 120px; border-radius: 10px; border: 4px solid var(--card); box-shadow: 0 0 0 1px var(--border); }
  .qr-label { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sub); margin-top: 5px; }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 21px; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.01em; color: var(--primary); }
  .title { color: var(--accent); font-weight: 700; font-size: 10.5px; margin: 0 0 6px; }
  .actions { display: grid; gap: 6px; margin-bottom: 12px; text-align: left; }
  .btn { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); color: var(--ink); text-decoration: none; font-size: 10.5px; font-weight: 500; }
  .icon { width: 16px; text-align: center; flex-shrink: 0; }
  .socials { display: flex; justify-content: center; gap: 10px; padding-bottom: 4px; }
  .social { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .social svg { width: 14px; height: 14px; fill: var(--bg); }
  .lead-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .save-btn { justify-content: center; font-size: 11px; padding: 9px 6px; background: transparent; color: var(--accent); border: 1px solid var(--accent); font-weight: 600; }
  .podcast-btn { justify-content: center; font-size: 11px; padding: 9px 6px; background: var(--accent); color: var(--bg); border: 1px solid var(--accent); font-weight: 600; }
  .podcast-platforms { font-size: 7.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--sub); margin-top: 4px; }
  .podcast-platforms a { color: var(--sub); text-decoration: underline; text-underline-offset: 2px; }

  @media (min-width: 600px) {
    .card { max-width: 420px; }
    .logo { width: 78px; }
    .tagline { font-size: 12px; margin: 12px 0 18px; }
    .qr-wrap { margin: 14px 0 0; }
    .qr-wrap img { width: 175px; height: 175px; }
    .qr-label { font-size: 11px; margin-top: 10px; }
    h1 { font-size: 30px; margin: 0 0 4px; }
    .title { font-size: 16px; margin: 0 0 8px; }
    .lead-actions { gap: 10px; margin-top: 18px; }
    .save-btn, .podcast-btn { font-size: 15px; padding: 14px 10px; }
    .podcast-platforms { font-size: 11px; margin-top: 8px; }
    .actions { gap: 10px; margin-bottom: 20px; margin-top: 6px; }
    .btn { padding: 13px 16px; font-size: 14px; gap: 12px; }
    .icon { width: 20px; }
    .socials { gap: 14px; padding-bottom: 4px; }
    .social { width: 42px; height: 42px; }
    .social svg { width: 20px; height: 20px; }
  }
</style>
